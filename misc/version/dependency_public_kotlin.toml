# 版本号
[versions]
# ----- 核心组件 -----
kotlin = "2.4.10"
ktx_coroutines = "1.11.0"
ktx_serial-json = "1.11.0"
ktx_io-core = "0.9.1"


# ----- 实用工具 -----
# TODO


# ----- 数据存储 -----
sqldelight = "2.3.2"
datastore = "1.2.0"


# ----- 网络通讯 -----
ktor = "3.5.1"


# ----- 人工智能 -----
mcp-sdk = "0.15.0"


# ----- 图形界面 -----
compose-ui = "1.12.1"
compose-material3 = "1.9.0"
compose-materialIcons = "1.7.3"
compose-resources = "1.11.1"
compose-viewmodel = "2.10.0"

reorderable = "2.4.3"
coil3 = "3.5.0"
filekit = "0.14.2"


# ----- 测试工具 -----
mockito-kotlin = "5.4.0"
mockk = "1.13.17"


# ----- Gradle 插件 -----
plugin_ksp = "2.2.21-2.0.5"
plugin_compose = "1.11.1"
plugin_agp = "8.13.2"
plugin_dokka = "2.2.0"
plugin_kover = "0.9.8"
plugin_buildConfig = "6.0.10"


# 组件
[libraries]
# ----- 核心组件 -----
# < Kotlin 官方组件 >
# Kotlin・标准库
standardlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
# Kotlin・反射
reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }
# Kotlin・测试工具
test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }

# < Kotlin 官方扩展 >
# Kotlin・协程・核心
ktx_coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "ktx_coroutines" }
# Kotlin・协程・Java Swing 支持（允许在 Java GUI 中使用 Main 调度器。）
ktx_coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "ktx_coroutines" }
# Kotlin・协程・测试工具
ktx_coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "ktx_coroutines" }
# Kotlin・序列化・JSON
ktx_serial-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "ktx_serial-json" }
# Kotlin・I/O・核心
ktx_io-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-io-core", version.ref = "ktx_io-core" }


# ----- 实用工具 -----
# TODO


# ----- 数据存储 -----
# < DataStore >
# DataStore・Preferences・核心（支持 JVM 平台）
datastore-preferences = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }

# < SQLDelight >
# SQLDelight・核心
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
# SQLDelight・驱动・SQLite
sqldelight-driver-sqlite = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
# SQLDelight・协程扩展（查询方法可以返回 Flow 类型。）
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }


# ----- 网络通讯 -----
# < Ktor >
# Ktor・服务端・核心
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
# Ktor・服务端・引擎（Tomcat）
ktor-server-tomcat = { module = "io.ktor:ktor-server-tomcat", version.ref = "ktor" }
# Ktor・服务端・引擎（Netty）
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
# Ktor・服务端・引擎（Jetty）
ktor-server-jetty = { module = "io.ktor:ktor-server-jetty", version.ref = "ktor" }
# Ktor・服务端・引擎（Coroutine-based I/O）
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
# Ktor・服务端・内容协定（配合序列化工具自动解析 JSON 等内容为对象。）
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
# Ktor・服务端・WebSocket
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
# Ktor・客户端・核心
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
# Ktor・客户端・引擎（Tomcat）
ktor-client-tomcat = { module = "io.ktor:ktor-client-tomcat", version.ref = "ktor" }
# Ktor・客户端・引擎（Netty）
ktor-client-netty = { module = "io.ktor:ktor-client-netty", version.ref = "ktor" }
# Ktor・客户端・引擎（Jetty）
ktor-client-jetty = { module = "io.ktor:ktor-client-jetty", version.ref = "ktor" }
# Ktor・客户端・引擎（Coroutine-based I/O）
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
# Ktor・客户端・内容协定（配合序列化工具自动解析 JSON 等内容为对象。）
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
# Ktor・客户端・WebSocket 支持
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
# Ktor・客户端・日志工具
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
# Ktor・序列化・KotlinX JSON 支持
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
# Ktor・网络・核心
ktor-network-core = { module = "io.ktor:ktor-network", version.ref = "ktor" }
# Ktor・网络・TLS 支持
ktor-network-tls = { module = "io.ktor:ktor-network-tls", version.ref = "ktor" }
# Ktor・网络・TLS 证书生成工具
ktor-network-tls-certificates = { module = "io.ktor:ktor-network-tls-certificates", version.ref = "ktor" }


# ----- 人工智能 -----
# MCP・服务端
mcp-server = { module = "io.modelcontextprotocol:kotlin-sdk-server", version.ref = "mcp-sdk" }
# MCP・客户端
mcp-client = { module = "io.modelcontextprotocol:kotlin-sdk-client", version.ref = "mcp-sdk" }


# ----- 图形界面 -----
# < Compose Multiplatform >
# Compose・UI・核心（提供测量、绘制、 Modifier 等能力，被 Material3 等上层模块依赖。）
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-ui" }
# Compose・UI・预览（提供 `@Preview` 注解定义，需要在所有变体引入确保编译通过。）
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-ui" }
# Compose・UI・调试工具（ IDE 预览功能，仅在 Debug 变体引入即可， Release 变体无需引入。）
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose-ui" }
# Compose・UI・绘图（提供 2D 画布等基础 API，被 UI 模块依赖，通常无需显式声明，仅编写库时使用。）
compose-ui-graphics = { module = "org.jetbrains.compose.ui:ui-graphics", version.ref = "compose-ui" }
# Compose・UI・Skiko（提供 Skia 引擎 API ，被 UI 模块依赖，通常无需显式声明，仅编写库时使用。）
compose-ui-skiko = { module = "org.jetbrains.compose.ui:ui-skiko", version.ref = "compose-ui" }
# Compose・基础组件（提供列表容器、手势处理等能力，被 Material3 等上层模块依赖。）
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-ui" }
# Compose・Material3
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
# Compose・Material3・窗口尺寸自适应
compose-material3-window-size = { module = "org.jetbrains.compose.material3:material3-window-size-class", version.ref = "compose-material3" }
# Compose・内置图标资源
compose-material-icons = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "compose-materialIcons" }
# Compose・资源框架
compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-resources" }
# Compose・ViewModel
compose-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "compose-viewmodel" }
# Compose・ViewModel・Navigation3
compose-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "compose-viewmodel" }


# < Reorderable >
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }
# < Coil3 >
# Coil3・Compose 支持
coil3-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil3" }
# < FileKit >
# FileKit・核心
filekit-core = { module = "io.github.vinceglb:filekit-core", version.ref = "filekit" }
# FileKit・对话框
filekit-dialogs = { module = "io.github.vinceglb:filekit-dialogs", version.ref = "filekit" }
# FileKit・对话框・Compose 扩展
filekit-dialogs-compose = { module = "io.github.vinceglb:filekit-dialogs-compose", version.ref = "filekit" }


# ----- 测试工具 -----
# < Mockito >
# Mockito・Kotlin 扩展
mockito-kotlin = { group = "org.mockito.kotlin", name = "mockito-kotlin", version.ref = "mockito-kotlin" }

# < MockK >
# 核心
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }


# Gradle插件
[plugins]
# ----- Kotlin -----
# 基础・JVM 平台支持
core = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# 扩展・序列化
serial = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# 扩展・Spring 支持
spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
# KSP（注解处理器）
ksp = { id = "com.google.devtools.ksp", version.ref = "plugin_ksp" }


# ----- Compose Multiplatform -----
# Compose Multiplatform
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "plugin_compose" }
# Compose Multiplatform 编译器（仅基于 Kotlin v2.0 之后的 Compose Multiplatform 版本需要声明）
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Kotlin Multiplatform
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
# Kotlin Multiplatform (Android Library)
kotlin-multiplatform-android = { id = "com.android.kotlin.multiplatform.library", version.ref = "plugin_agp" }


# ----- 其他插件 -----
# SQLDelight
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
# Dokka（文档生成工具）
dokka = { id = "org.jetbrains.dokka", version.ref = "plugin_dokka" }
# Kover（测试代码覆盖率检测工具）
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "plugin_kover" }
# BuildConfig 生成插件（类似 Android 的 BuildConfig 类生成工具，以便我们通过构建脚本向应用程序注入版本号等信息。）
buildConfig = { id = "com.github.gmazzo.buildconfig", version.ref = "plugin_buildConfig" }
